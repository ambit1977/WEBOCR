<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>簡易ブラウザOCR</title>
  <link rel="stylesheet" href="style.css">
  <!-- Tesseract.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
</head>
<body>
  <main>
    <h1>簡易ブラウザOCR</h1>
    <div class="controls">
      <input id="file-input" type="file" accept="image/*">
      <button id="recognize-btn" disabled>認識する</button>
      <div id="status">準備完了</div>
      <button id="retry-btn" style="display:none">再試行</button>
    </div>

    <label class="mode-label">
      <input id="num-only" type="checkbox" checked>
      <strong>数字のみモード</strong>（純JS前処理 + 行検出 + Tesseract）
    </label>

    <div id="error" class="error" style="display:none;margin-top:10px;color:#b00020;background:#fff0f0;padding:8px;border-radius:6px;border:1px solid #f1c0c0">
      <strong>エラー:</strong>
      <pre id="error-log" style="white-space:pre-wrap;margin-top:6px"></pre>
    </div>

    <canvas id="canvas" style="display:none"></canvas>

    <!-- preview + overlay wrapper -->
    <div class="preview-wrap">
      <img id="preview-img" alt="preview" style="display:none" />
      <canvas id="overlay" style="display:none"></canvas>
    </div>

    <section class="result">
      <h2>認識結果</h2>
      <textarea id="result-text" rows="10" placeholder="ここに認識結果が表示されます..."></textarea>
      <div id="regions-list"></div>
      <div class="actions">
        <button id="copy-btn">コピー</button>
        <select id="lang-select">
          <option value="eng" selected>英語 (eng)</option>
          <option value="jpn">日本語 (jpn)</option>
          <option value="eng+jpn">英語+日本語 (eng+jpn)</option>
        </select>
      </div>
    </section>

    <footer>
      <small>動作: ローカルで index.html をブラウザで開いてください。Tesseract.js がモデルをダウンロードします。</small>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
